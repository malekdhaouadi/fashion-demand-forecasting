name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: python -m pytest -q

      - name: Build synthetic fixture (real data is not in git)
        run: python -m src.data.fixture

      - name: Simulate sales
        run: python -m src.data.simulate --style-col cluster --style-effect 0.3

      - name: Build features
        run: python -m src.features.build --tag cluster_style0.3 --model-clusters clusters_model.csv

      - name: Data validation (must pass)
        run: python -m src.data.validate --stage all --tag cluster_style0.3

      - name: Data validation must FAIL on broken data
        run: |
          python -c "import pandas as pd; d=pd.read_parquet('data/processed/series_weekly_cluster_style0.3.parquet'); d.loc[5,'sales']=-3; d.to_parquet('data/processed/series_weekly_broken.parquet')"
          if python -m src.data.validate --stage sales --tag broken; then
            echo "validation should have failed on negative sales"; exit 1
          fi

      - name: Smoke-train
        run: python -m src.models.xgb --tag cluster_style0.3 --smoke

      - name: Registry and promotion rule
        run: |
          python -m src.models.promote --n-estimators 30
          python -m src.models.promote --n-estimators 30 --max-depth 1